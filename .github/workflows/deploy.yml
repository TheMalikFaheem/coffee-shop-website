name: Build and Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Open Firewall Ports on Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: root
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST bash << 'ENDSSH'
            set -e

            # Install ufw if missing
            apt-get install -y ufw 2>/dev/null || true

            # Always allow SSH first — never get locked out
            ufw allow 22/tcp

            # Allow standard web ports
            ufw allow 80/tcp
            ufw allow 443/tcp

            # Allow port 4000 — the app's serve port
            ufw allow 4000/tcp

            # Enable firewall non-interactively
            ufw --force enable

            echo "=== Firewall Status ==="
            ufw status verbose
          ENDSSH

      - name: Deploy Files to Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: root
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          # Ensure target directory exists
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p $TARGET_DIR"

          # Sync built dist/ files to server
          rsync -ravz --delete dist/ $SERVER_USER@$SERVER_HOST:$TARGET_DIR

          # Fix file permissions
          ssh $SERVER_USER@$SERVER_HOST "find $TARGET_DIR -type d -exec chmod 755 {} \; && find $TARGET_DIR -type f -exec chmod 644 {} \;"

      - name: Start / Restart App on Port 4000 via PM2
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: root
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST bash << ENDSSH
            set -e

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            # Install PM2 globally if not present
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Install serve globally if not present
            if ! command -v serve &> /dev/null; then
              npm install -g serve
            fi

            # Stop existing app instance if running (ignore error if not found)
            pm2 stop verdant-cafe 2>/dev/null || true
            pm2 delete verdant-cafe 2>/dev/null || true

            # Start serving the built files on port 4000
            pm2 start serve --name verdant-cafe -- -s $TARGET_DIR -l 4000

            # Save PM2 process list so it auto-starts on server reboot
            pm2 save

            # Register PM2 to start on system boot
            pm2 startup systemd -u root --hp /root | tail -1 | bash || true

            echo "=== App running on port 4000 ==="
            pm2 list
          ENDSSH
